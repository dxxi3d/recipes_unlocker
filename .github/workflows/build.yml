# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: dev-build
on:
  push:
    branches: ['26.X']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build -Pversion=1.0.0-build${GITHUB_RUN_NUMBER}

      - name: update dev-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create dev-build --repo "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" \
                 --title "Dev builds" \
                 --notes "Latest: 1.0.0-build${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
                 --prerelease

          gh release upload dev-build build/libs/*.jar --repo "$GITHUB_REPOSITORY"

          new_asset=$(basename build/libs/*.jar)
          gh release view dev-build --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | while read -r name; do
                [ "$name" = "$new_asset" ] || \
                  gh release delete-asset dev-build "$name" --repo "$GITHUB_REPOSITORY" -y
              done

          gh release edit dev-build --repo "$GITHUB_REPOSITORY" \
            --notes "Latest: 1.0.0-build${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"